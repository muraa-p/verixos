name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: the workflow only ever needs to read the repository.
permissions:
  contents: read

# A new push to a branch cancels the run in flight for that branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: typecheck (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22.x is the declared engine floor; 24.x is the current release line.
        node: ['22.x', '24.x']
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  boot-smoke:
    name: boot smoke test
    runs-on: ubuntu-latest
    # The gate that used to sit here is removed. src/cli.ts now exists, the
    # interpreter executes the boot sector, and this job can actually fail -
    # which is the only reason a smoke test is worth having.
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Boot the machine model
        run: |
          set +e
          node --experimental-strip-types --no-warnings src/cli.ts boot --smoke
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "::error::boot smoke test failed with exit code $status"
            exit "$status"
          fi

  desktop-smoke:
    name: desktop is visible and responsive
    runs-on: ubuntu-latest
    # Asserts the three things a screenshot cannot: that the desktop draws, that a
    # keystroke changes the frame buffer, and that the compositor is examining far
    # less than the whole screen. A build that renders a correct-looking image with
    # a broken compositor passes an image comparison and fails this.
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run the desktop and check the frames
        run: |
          set +e
          node --experimental-strip-types --no-warnings src/cli.ts gui \
            --frames 120 --keys "Tab/2/type:ver/Enter/F1/F1" --check
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "::error::desktop smoke test failed with exit code $status"
            exit "$status"
          fi

      - name: Render the desktop to images
        run: |
          node --experimental-strip-types --no-warnings src/cli.ts gui \
            --frames 120 --every 60 --scale 3 --out docs/assets \
            --keys "Tab/type:ver/Enter" --boot-frame

      - name: Fail if the committed images differ
        run: |
          if ! git diff --quiet -- docs/assets; then
            echo "::error::docs/assets is out of date. Re-run the command above and commit the result."
            git --no-pager diff --stat -- docs/assets
            exit 1
          fi

  built-desktop:
    name: the built binary serves a desktop
    runs-on: ubuntu-latest
    # tsc only emits .ts. The boot sector, stage 2 and the live desktop's client
    # files are data that the runtime reads off disk, so a build that compiles and
    # stops produces a dist that passes every unit test and then fails the first
    # time somebody runs it. This job runs the built output, not the source.
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Boot from dist
        run: node dist/src/cli.js boot --smoke

      - name: Serve the desktop from dist and fetch it
        run: |
          set -euo pipefail
          node dist/src/cli.js live --no-open --fps 15 > log.txt 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT

          # Poll rather than sleeping a fixed time: CI machines vary, and a fixed
          # sleep is either flaky or unnecessarily slow.
          url=""
          for _ in $(seq 1 60); do
            url=$(grep -o 'http://127\.0\.0\.1:[0-9]*' log.txt | head -n 1 || true)
            if [ -n "$url" ]; then break; fi
            sleep 1
          done
          if [ -z "$url" ]; then
            echo "::error::the desktop never printed a URL:"
            cat log.txt
            exit 1
          fi

          curl --fail --silent --show-error "$url/" | grep -q '<canvas'
          curl --fail --silent --show-error "$url/client.js" | grep -q 'new WebSocket'
          curl --fail --silent --show-error --output frame.png "$url/screenshot.png"
          # The PNG signature, checked as bytes. A shell text check would pass on a
          # response that is not a PNG at all.
          if [ "$(head -c 4 frame.png | od -An -tx1 | tr -d ' \n')" != "89504e47" ]; then
            echo "::error::the screenshot endpoint did not return a PNG"
            exit 1
          fi
          echo "the built binary served a canvas, its script and a $url screenshot"

      - name: Upload the frame the built binary produced
        uses: actions/upload-artifact@v4
        with:
          name: built-desktop-frame
          path: frame.png
          if-no-files-found: error
          retention-days: 7

  assets:
    name: docs assets are current
    runs-on: ubuntu-latest
    # tools/screenshot.ts renders the README images from the real VGA framebuffer.
    # If a change to the VGA adapter or the font ROM alters what those images show,
    # this job fails rather than letting the README drift from the code.
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Regenerate screenshots
        run: npm run screenshot

      - name: Fail if the committed images differ
        run: |
          if ! git diff --quiet -- docs/assets; then
            echo "::error::docs/assets is out of date. Run 'npm run screenshot' and commit the result."
            git --no-pager diff --stat -- docs/assets
            exit 1
          fi

      - name: Upload regenerated images
        uses: actions/upload-artifact@v4
        with:
          name: docs-assets
          path: docs/assets/
          if-no-files-found: error
          retention-days: 7
