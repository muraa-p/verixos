name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: the workflow only ever needs to read the repository.
permissions:
  contents: read

# A new push to a branch cancels the run in flight for that branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: typecheck (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22.x is the declared engine floor; 24.x is the current release line.
        node: ['22.x', '24.x']
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  boot-smoke:
    name: boot smoke test
    runs-on: ubuntu-latest
    # There is no CLI yet: src/cli.ts is Phase 1 work and does not exist. This job
    # is gated on the file appearing rather than deleted, so that the day the
    # interpreter and boot path land, the smoke test starts running without anyone
    # having to remember to re-add it.
    #
    # Removing the gate is the correct move at that point, not before: a smoke test
    # that is present but always failing trains everyone to ignore red builds,
    # which is worse than having no smoke test at all.
    if: false
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Boot the machine model
        run: |
          set +e
          node --experimental-strip-types --no-warnings src/cli.ts boot --smoke
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "::error::boot smoke test failed with exit code $status"
            exit "$status"
          fi

  assets:
    name: docs assets are current
    runs-on: ubuntu-latest
    # tools/screenshot.ts renders the README images from the real VGA framebuffer.
    # If a change to the VGA adapter or the font ROM alters what those images show,
    # this job fails rather than letting the README drift from the code.
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Regenerate screenshots
        run: npm run screenshot

      - name: Fail if the committed images differ
        run: |
          if ! git diff --quiet -- docs/assets; then
            echo "::error::docs/assets is out of date. Run 'npm run screenshot' and commit the result."
            git --no-pager diff --stat -- docs/assets
            exit 1
          fi

      - name: Upload regenerated images
        uses: actions/upload-artifact@v4
        with:
          name: docs-assets
          path: docs/assets/
          if-no-files-found: error
          retention-days: 7
